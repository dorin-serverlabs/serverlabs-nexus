[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serverlabs-nexus"
version = "0.4.2"
description = "Bare-metal GPU appliance diagnostics, Redfish BMC telemetry, and hybrid vLLM/Azure/Vertex inference gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Constantin-Dorin Chitic", email = "dorin@serverlabs.ai" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
]

[project.scripts]
nexus = "nexus.cli:main"

[project.urls]
Homepage = "https://serverlabs.ai/platform"
Repository = "https://github.com/dorin-serverlabs/serverlabs-nexus"
Issues = "https://github.com/dorin-serverlabs/serverlabs-nexus/issues"
